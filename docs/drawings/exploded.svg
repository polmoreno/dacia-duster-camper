  <rect x="80" y="380" width="280" height="112" class="fill-box"/>
  <text x="80" y="372" class="dim">SIDE_L / SIDE_R</text>
  <rect x="420" y="80" width="322" height="106.75" class="fill-box"/>
  <text x="420" y="72" class="dim">FRONT</text>
  <rect x="420" y="280" width="322" height="56" class="fill-box"/>
  <text x="420" y="272" class="dim">RAIL_TOP</text>
