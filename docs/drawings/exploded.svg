  <text x="420" y="432" class="dim">TABLE</text>
  <rect x="800" y="80" width="266" height="224" class="fill-deck"/>
  <text x="800" y="72" class="dim">DECK_P1</text>
  <rect x="800" y="340" width="266" height="153.72" class="fill-deck"/>
  <text x="800" y="332" class="dim">DECK_P2</text>
  <rect x="800" y="540" width="266" height="153.72" class="fill-deck"/>
