<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2100mm" height="2550mm"
     viewBox="0 0 2100 2550">
  <title>Unfolded — sleep</title>
  <style>
    .cut { fill: none; stroke: #111; stroke-width: 0.4; }
    .cut-inner { fill: none; stroke: #111; stroke-width: 0.4; }
    .engrave { fill: none; stroke: #888; stroke-width: 0.2; }
    .dim { fill: #333; font: 12px sans-serif; }
    .dim-line { fill: none; stroke: #444; stroke-width: 0.5; }
    .part-name { fill: #111; font: 15px sans-serif; }
    .size { fill: #222; font: 13px sans-serif; }
    .section { fill: #111; font: 18px sans-serif; }
    .title { fill: #111; font: 22px sans-serif; }
    .note { fill: #444; font: 11px sans-serif; }
    .fill-box { fill: #d8c7a1; stroke: #5a4a32; stroke-width: 0.8; }
    .fill-deck { fill: #c9b48a; stroke: #5a4a32; stroke-width: 0.8; }
    .fill-wing { fill: #b9d4c0; stroke: #2f5d3a; stroke-width: 0.8; }
    .fill-frame { fill: #9aa7b5; stroke: #2c3a4a; stroke-width: 0.8; }
    .car { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 8 4; }
    .sheet { fill: #f4f1ea; stroke: #333; stroke-width: 1; }
  </style>
  <text x="24" y="36" class="title">Unfolded sleep  ·  1900 x 950 / 1300 mm  ·  official size, Duster II box</text>
  <text x="80" y="80" class="dim">PLAN (looking down, tailgate at the top)</text>
  <rect x="255" y="110" width="950" height="800" class="fill-box"/>
  <rect x="255" y="910" width="950" height="549" class="fill-deck"/>
  <rect x="255" y="1459" width="950" height="549" class="fill-deck"/>
  <rect x="80" y="910" width="175" height="549" class="fill-wing"/>
  <rect x="1205" y="910" width="175" height="549" class="fill-wing"/>
  <text x="267" y="134" class="dim">P1 / box  (tailgate / table)</text>
  <text x="267" y="934" class="dim">P2  + wings 1300 mm</text>
  <text x="267" y="1483" class="dim">P3  (front seats)</text>
  <text x="80" y="2038" class="dim">length 1900   boot width 950   door width 1300</text>
  <text x="80" y="2070" class="dim">SIDE</text>
  <rect x="80" y="2090" width="800" height="320" class="fill-box"/>
  <rect x="80" y="2075" width="800" height="15" class="fill-deck"/>
  <rect x="880" y="2075" width="1100" height="15" class="fill-deck"/>
  <rect x="880" y="2130" width="12" height="80" class="fill-frame"/>
  <rect x="1968" y="2105" width="12" height="305" class="fill-frame"/>
  <text x="80" y="2434" class="note">box 800   frame + legs under P2/P3</text>
  <text x="24" y="2470" class="note">Deploy: fold rear seats · pull frame · slot 2 slats · unfold Z-deck · slide wings · mattress + wing pads · footwell pads. Table 15 kg max.</text>
</svg>