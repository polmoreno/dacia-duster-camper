<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400mm" height="900mm"
     viewBox="0 0 1400 900">
  <title>Folded — daily driving</title>
  <style>
    .cut { fill: none; stroke: #111; stroke-width: 0.4; }
    .cut-inner { fill: none; stroke: #111; stroke-width: 0.4; }
    .engrave { fill: none; stroke: #888; stroke-width: 0.2; }
    .dim { fill: #333; font: 12px sans-serif; }
    .dim-line { fill: none; stroke: #444; stroke-width: 0.5; }
    .part-name { fill: #111; font: 15px sans-serif; }
    .size { fill: #222; font: 13px sans-serif; }
    .section { fill: #111; font: 18px sans-serif; }
    .title { fill: #111; font: 22px sans-serif; }
    .note { fill: #444; font: 11px sans-serif; }
    .fill-box { fill: #d8c7a1; stroke: #5a4a32; stroke-width: 0.8; }
    .fill-deck { fill: #c9b48a; stroke: #5a4a32; stroke-width: 0.8; }
    .fill-wing { fill: #b9d4c0; stroke: #2f5d3a; stroke-width: 0.8; }
    .fill-frame { fill: #9aa7b5; stroke: #2c3a4a; stroke-width: 0.8; }
    .car { fill: none; stroke: #666; stroke-width: 1.2; stroke-dasharray: 8 4; }
    .sheet { fill: #f4f1ea; stroke: #333; stroke-width: 1; }
  </style>
  <text x="24" y="36" class="title">Folded (daily driving) — v0.1  ·  Duster II 4x2 GLP</text>
  <text x="24" y="58" class="note">5 seats usable. Box strapped to factory tie-downs. Parcel shelf on top if G allows.</text>
  <text x="80" y="184" class="dim">SIDE (left)</text>
  <polyline points="60,600 60,200 1060,200 1060,600" class="car" fill="none"/>
  <text x="64" y="590" class="note">boot floor</text>
  <rect x="120" y="280" width="800" height="320" class="fill-box"/>
  <rect x="120" y="250" width="800" height="30" class="fill-deck"/>
  <text x="130" y="304" class="dim">800 x 320</text>
  <text x="130" y="270" class="note">P2+P3 stacked</text>
  <text x="1000" y="184" class="dim">REAR (tailgate)</text>
  <rect x="1000" y="280" width="950" height="320" class="fill-box"/>
  <rect x="1015" y="352" width="918" height="198" class="fill-deck"/>
  <text x="1008" y="302" class="dim">950 wide</text>
  <text x="1008" y="520" class="note">table flap closed</text>
  <text x="24" y="820" class="note">Clearance target: arches 977 mm  ·  box 950 mm  ·  seats-up depth 990 mm</text>
</svg>